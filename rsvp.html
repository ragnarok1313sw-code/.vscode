<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Kehadiran Pernikahaan - Angga Rahwono & Sinta Rahayu</title>
    <link rel="stylesheet" href="wedding.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>RSVP Kehadiran</h1>
            </div>
            
            <h2>Konfirmasi Kehadiran</h2>
            <p>Silakan isi formulir di bawah ini untuk mengonfirmasi kehadiran Anda.</p>

            <form action="#" method="POST" style="margin-top: 20px;">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
                </div>

                <div class="form-group">
                    <label for="kehadiran">Status Kehadiran</label>
                    <select id="kehadiran" name="kehadiran" required>
                        <option value="">Pilih Kehadiran</option>
                        <option value="hadir">Hadir</option>
                        <option value="tidak_hadir">Berhalangan Hadir</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pesan">Ucapan &amp; Doa Restu</label>
                    <textarea id="pesan" name="pesan" rows="3" placeholder="Tuliskan ucapan atau doa untuk kedua mempelai"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Kirim Konfirmasi</button>
            </form>

            <a href="index.html" class="back-link">&larr; Kembali ke Halaman Utama</a>
        </div>
    </div>
</body>
</html>
